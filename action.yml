name: 'Lark Notify'
description: 'Send a text notification to a Lark/Feishu custom bot via webhook.'

branding:
  icon: 'message-square'
  color: 'blue'

inputs:
  webhook:
    description: 'Lark/Feishu custom bot webhook URL'
    required: true
  content:
    description: 'Text message content to send'
    required: true
  secret:
    description: 'Signing secret from the bot''s signature verification setting'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - run: ${{ github.action_path }}/entrypoint.sh
      shell: bash
      env:
        INPUT_WEBHOOK: ${{ inputs.webhook }}
        INPUT_CONTENT: ${{ inputs.content }}
        INPUT_SECRET: ${{ inputs.secret }}
